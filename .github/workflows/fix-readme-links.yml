
name: Fix README links (master -> main)
 
on:
  push:
    branches: [main]
    paths: [README.md]
  workflow_dispatch:
 
permissions:
  contents: write
 
jobs:
  fix-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - name: Replace tree/master/ with tree/main/
        run: sed -i 's#/tree/master/#/tree/main/#g' README.md
 
      - name: Commit if anything changed
        run: |
          if git diff --quiet; then
            echo "Links already point to main."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Fix README links: master -> main"
          git pull --rebase
          git push
 
